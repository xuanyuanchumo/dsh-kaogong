name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 提交信息校验需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (no runtime deps — registry-free)
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      # ── 门禁 1：提交信息格式（BL-PROC-02）────────────────────────
      # 只在 PR 上校验新增提交，避免历史提交一次性阻断。
      - name: Commit message gate
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for sha in $(git rev-list "$base..$head"); do
            msg=$(git log -1 --pretty=%s "$sha")
            printf '%s\n' "$msg" > /tmp/cm.txt
            if ! node scripts/git-hooks/commit-msg.mjs /tmp/cm.txt >/dev/null 2>&1; then
              echo "::error::提交 $sha 信息不合规：$msg"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "规范见 CONTRIBUTING.md §二"
            exit 1
          fi
          echo "提交信息全部合规"
        continue-on-error: false

      # ── 门禁 2：类型门 ─────────────────────────────────────────
      - name: Type gate
        run: npx tsc --noEmit

      # ── 门禁 3：构建门（含 combo 产物形态硬守卫）──────────────────
      - name: Build
        run: npm run build

      # ── 门禁 4：文档门禁（BL-DOC-02）────────────────────────────
      - name: Docs gate
        run: node scripts/docs/check-docs.mjs

      # ── 门禁 5：文档事实源新鲜度（BL-DOC-01）─────────────────────
      # dist 已由上一步构建产出，gen-facts 可直接读运行时真值。
      - name: Facts freshness gate
        run: |
          node scripts/docs/gen-facts.mjs --check || {
            echo "::error::docs/facts.json 已过期。本地运行：node scripts/docs/gen-facts.mjs 并提交"
            exit 1
          }
          node scripts/docs/check-facts.mjs

      # ── 门禁 6：断言数只增不减（BL-TEST-02）────────────────────
      - name: Assertion baseline gate
        run: |
          node - <<'PY'
          const fs = require('node:fs');
          const facts = JSON.parse(fs.readFileSync('docs/facts.json', 'utf-8'));
          const baseline = JSON.parse(fs.readFileSync('docs/facts.baseline.json', 'utf-8'));
          let fail = 0;
          for (const k of ['smoke', 'render', 'loader']) {
            const now = facts.assertions[k];
            const was = baseline.assertions[k];
            if (now < was) {
              console.error(`::error::${k} 断言数倒退：${was} → ${now}（守卫只增不减，删断言必须在 PR 说明理由并同步更新 baseline）`);
              fail = 1;
            } else if (now > was) {
              console.log(`${k} 断言数增加：${was} → ${now}（请提交新的 baseline）`);
            } else {
              console.log(`${k} 断言数持平：${now}`);
            }
          }
          process.exit(fail);
          PY

      # ── 测试 ──────────────────────────────────────────────────
      - name: Loader entry (真实 Loader + 三层隔离)
        # loader.test.mjs 会检测 _dshcli/node_modules 的 Cordis Loader；
        # 本地/带 dev 依赖环境必须跑，纯 keyless CI 缺依赖时脚本自跳过（打印说明）。
        run: node loader.test.mjs

      - name: Smoke
        run: node smoke.test.mjs

      - name: Render
        run: node render.test.mjs
