name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 提交信息校验需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (no runtime deps — registry-free)
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      # ── 门禁 0：题库 fixture + 建池（cycle-62 CI 修复）────────────
      # 为什么需要：有一批 smoke 断言**天然依赖真实题库数据**（统一池的五维标注 /
      # 关系边 / 带图题 / 真题卷索引 / 方法论语料）。这些数据由用户「📦 题库管理」
      # 按需克隆——CI runner 上恒不存在 → 断言必然红（CI 自 2026-11-21 起持续红，
      # 25 个文件 / 54 个断言）。
      #
      # 为什么是「装全量」而不是「加降级守卫」：
      #   守卫方案要改 12 个测试文件、每处人工判断「这条断言需不需要数据」，
      #   漏一处 CI 就红，且本地覆盖被悄悄削弱；装全量则**测试代码零改动**，
      #   断言即真值（更简单 = 更少出错面）。
      #
      # 镜像代理？**不用**——CI runner 在 GitHub 机房，直连 GitHub 最快最稳；
      #   第三方代理是给国内用户机器用的（插件内置 mirror 功能正是为此），
      #   且走代理 = CI 验证的是「代理给的代码」而非官方源（供应链风险）。
      #
      # 缓存：actions/cache 缓存题库克隆与建好的池 → 首次约 3-5 分钟，之后秒级。
      - name: Cache question-bank repos
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kg-repos
          key: kg-repos-v1-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Cache built pool
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kaogong-data
          key: kg-pool-v1-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Fetch question-bank repos
        run: |
          set -euo pipefail
          REPOS_ROOT="${{ runner.temp }}/kg-repos"
          mkdir -p "$REPOS_ROOT"
          for spec in \
            "https://github.com/WangJunqing-coder/huasheng13-skill huasheng13" \
            "https://github.com/Cha551/gk-tuxing gk-tuxing" \
            "https://github.com/KeWang0622/kaogong-skill kaogong-skill" \
            "https://github.com/ERRRC/xingcezhenti xingcezhenti" \
            "https://github.com/YMDHZBSJ/xingce-app xingce-app" \
            "https://github.com/jangviktor-web/GongkaoNaoku GongkaoNaoku" \
            "https://github.com/ProfessorZhi/gwy-zhenti gwy-zhenti" \
            "https://github.com/Timothy-yqw19/qiuzhao-epi-bank qiuzhao-epi-bank" \
            "https://github.com/tongnian0666-code/civil-exam-agent civil-exam-agent" \
          ; do
            url="${spec% *}"; dir="${spec##* }"
            if [ -d "$REPOS_ROOT/$dir" ]; then
              echo "跳过 $dir（缓存命中）"
              continue
            fi
            echo "克隆 $dir …"
            git clone --depth 1 --quiet "$url" "$REPOS_ROOT/$dir"
          done
          du -sh "$REPOS_ROOT" || true

      - name: Build unified pool (once — all tests share it)
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/kaogong-data"
          node scripts/ci/build-pool.mjs \
            --repo-root "${{ runner.temp }}/kg-repos" \
            --data-dir  "${{ runner.temp }}/kaogong-data"

      - name: Expose repos + data to tests
        run: |
          echo "KG_REPOS_DIR=${{ runner.temp }}/kg-repos" >> "$GITHUB_ENV"
          echo "KG_DATA_DIR=${{ runner.temp }}/kaogong-data" >> "$GITHUB_ENV"

      # ── 门禁 1：提交信息格式（BL-PROC-02）────────────────────────
      # 只在 PR 上校验新增提交，避免历史提交一次性阻断。
      - name: Commit message gate
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for sha in $(git rev-list "$base..$head"); do
            msg=$(git log -1 --pretty=%s "$sha")
            printf '%s\n' "$msg" > /tmp/cm.txt
            if ! node scripts/git-hooks/commit-msg.mjs /tmp/cm.txt >/dev/null 2>&1; then
              echo "::error::提交 $sha 信息不合规：$msg"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "规范见 CONTRIBUTING.md §二"
            exit 1
          fi
          echo "提交信息全部合规"
        continue-on-error: false

      # ── 门禁 2：类型门 ─────────────────────────────────────────
      - name: Type gate
        run: npx tsc --noEmit

      # ── 门禁 3：构建门（含 combo 产物形态硬守卫）──────────────────
      - name: Build
        run: npm run build

      # ── 门禁 4：文档门禁（BL-DOC-02）────────────────────────────
      - name: Docs gate
        run: node scripts/docs/check-docs.mjs

      # ── 门禁 5：文档事实源新鲜度（BL-DOC-01）─────────────────────
      # 只校验可从 manifest 派生的能力计数；断言数不属于事实源。
      - name: Facts freshness gate
        run: |
          node scripts/docs/gen-facts.mjs --check || {
            echo "::error::docs/facts.json 已过期。本地运行：node scripts/docs/gen-facts.mjs 并提交"
            exit 1
          }
          node scripts/docs/check-facts.mjs

      # ── 唯一质量门：测试退出码 ───────────────────────────────────
      # 不再做「断言数只增不减」之类的自我声明式门禁——那比对的是提交进仓库的数字，
      # 不是测试真实结果；测试全绿本身就是唯一可信的质量信号。
      # Loader 真实入口测试依赖开发期 Cordis Loader（_dshcli/node_modules），CI keyless 环境没有，
      # 故不在 CI 跑；它在本地 `npm run test:all` 中随 dev 依赖执行（见 loader.test.mjs 注释）。
      #
      # cycle-47 测试分域重构后，根目录 smoke.test.mjs / render.test.mjs 已退役为
      # legacy-*.bak；全部断言迁入 tests/** 分域文件，统一由 vitest 聚合执行。
      # 原两步 `node smoke.test.mjs` / `node render.test.mjs` 指向已不存在的文件，
      # CI 必然以 MODULE_NOT_FOUND 失败——合并为单一的 test:vitest 门禁。
      - name: Tests (smoke + render + unit domains)
        run: npm run test:vitest
