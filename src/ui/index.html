<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考公学习平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<!--
  dsh-kaogong 独立 SPA（零依赖单文件，CSS 由服务端内联 app.css）
  v1.8（cycle-12）：交互式可交互知识图谱（力导向/分层·缩放平移·拖拽·悬停·过滤·搜索·路径）
                   + 可观测面板（生命周期 stepper / 能力对账 / 端点性能排序 / 告警分级 / 命名空间）
                   + 现代响应式排版与深色模式（prefers-color-scheme）
  约束：所有 API 走 ?ws= 隔离键；不引外部依赖；所有接口字符串经 textContent/文本节点进 DOM（禁未转义 innerHTML）
-->
<style>/*__APP_CSS__*/</style>
</head>
<body>
<div class="nav">
  <div class="brand">📚 考公学习</div>
  <div class="tabs" id="tabs"></div>
  <div class="nav-right">
    <span class="ws-tag" id="ws-tag" title="当前工作区隔离命名空间">…</span>
    <span class="beacon down" id="beacon"></span>
    <span id="beacon-txt">连接中</span>
    <button class="icon-btn" id="theme-btn" title="切换主题（跟随系统 / 浅色 / 深色）" aria-label="切换主题">🌗</button>
  </div>
</div>
<div class="content" id="app"></div>
<div class="toast" id="toasts" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   基础层：参数 / API / 发现 / 主题 / DOM 工具
   ═══════════════════════════════════════════════════════════════ */
const PARAMS = new URLSearchParams(location.search)
const WS = PARAMS.get('ws') || 'default'
let BASE = null

/** 所有请求统一附加 ws 隔离键；返回值一律 JSON */
async function api(p, opts) {
  const sep = p.includes('?') ? '&' : '?'
  const res = await fetch(BASE + p + sep + 'ws=' + encodeURIComponent(WS), opts)
  return res.json()
}
/** 容错请求：{ok,data} / {ok:false,err}，供可观测视图做分区降级（接口失败不白屏） */
async function apiSafe(p, opts) {
  try {
    const data = await api(p, opts)
    if (data && typeof data === 'object' && data.error && Object.keys(data).length === 1) return { ok: false, err: String(data.error) }
    return { ok: true, data }
  } catch (e) {
    return { ok: false, err: e && e.message ? e.message : String(e) }
  }
}
async function discover() {
  // 同源优先：UI 由宿主路由 /kaogong/ 提供时，API 直接走同源（零 CORS、无端口依赖）
  if (location.pathname.startsWith('/kaogong')) {
    try {
      const r = await fetch(`/kaogong/api/status?ws=${encodeURIComponent(WS)}`, { signal: AbortSignal.timeout(1200) })
      const j = await r.json()
      if (j && j.app === 'dsh-kaogong') { BASE = '/kaogong'; return j }
    } catch {}
  }
  for (const port of [8400, 8401, 8402, 8403, 8404]) {
    try {
      const r = await fetch(`http://127.0.0.1:${port}/api/status?ws=${encodeURIComponent(WS)}`, { signal: AbortSignal.timeout(900) })
      const j = await r.json()
      if (j && j.app === 'dsh-kaogong') { BASE = `http://127.0.0.1:${port}`; return j }
    } catch {}
  }
  return null
}

/** 当前是否深色（auto 模式跟随系统） */
function isDark() {
  const t = document.documentElement.dataset.theme
  if (t === 'dark') return true
  if (t === 'light') return false
  return matchMedia('(prefers-color-scheme: dark)').matches
}
;(function initTheme() {
  const urlTheme = PARAMS.get('theme')
  const saved = localStorage.getItem('kg-theme')
  // 默认 auto：CSS 侧用 prefers-color-scheme 适配；显式选择则固定
  const mode = (urlTheme === 'dark' || urlTheme === 'light') ? urlTheme
    : (saved === 'dark' || saved === 'light' ? saved : 'auto')
  document.documentElement.dataset.theme = mode
  document.getElementById('theme-btn').onclick = () => {
    const n = isDark() ? 'light' : 'dark'
    document.documentElement.dataset.theme = n
    localStorage.setItem('kg-theme', n)
    if (cur === 'graph' || cur === 'obs') render()
  }
  // 系统主题变化：仅 auto 模式跟随（图谱需重绘取色）
  try {
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (document.documentElement.dataset.theme === 'auto' && (cur === 'graph' || cur === 'obs')) render()
    })
  } catch {}
})()

/** 极简 DOM 构造器。p 允许为 null（R4 事故：显式 null 会击穿默认参数） */
function el(t, p = {}, ...ch) {
  const e = document.createElement(t)
  for (const [k, v] of Object.entries(p||{})) {
    if (v == null) continue
    if (k === 'class') e.className = v
    else if (k === 'style') e.style.cssText = v
    else if (k === 'html') e.innerHTML = v // 仅限内部静态字符串；接口数据一律走文本节点
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v)
    else e.setAttribute(k, v)
  }
  ch.flat(9).forEach(c => c != null && c !== false && e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))))
  return e
}
function kv(l, v) { return el('div', { class: 'kvi' }, l, el('b', null, v)) }
function kv0(l, v) { return el('div', { class: 'card stat' }, el('div', { class: 'v', style: 'font-size:19px' }, String(v)), el('div', { class: 'l' }, l)) }
function toast(msg, type = 'info', ms = 2600) {
  const box = document.getElementById('toasts')
  const t = el('div', { class: type }, msg)
  box.appendChild(t)
  setTimeout(() => { t.style.transition = 'opacity .3s,transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 320) }, ms)
}
function skel(n = 3) { return el('div', { class: 'card' }, Array.from({ length: n }, (_, i) => el('div', { class: 'skel ' + (i === 0 ? 'mid' : 'big') }))) }
/** 降级提示条（接口不可用 / 数据缺失时替代白屏） */
function notice(msg, kind = 'warn') { return el('div', { class: 'notice ' + kind }, '⚠️ ', msg) }
function fmtDur(s) {
  if (s == null || isNaN(s)) return '—'
  if (s < 60) return s + 's'
  if (s < 3600) return Math.floor(s / 60) + 'm' + (s % 60) + 's'
  return Math.floor(s / 3600) + 'h' + Math.floor((s % 3600) / 60) + 'm'
}

/* ═══ SVG 图表（零依赖）═══ */
function svgmk(tag, at) { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(at)) n.setAttribute(k, v); return n }
function svgLine(days) {
  if (!days || days.length < 2) return el('div', { style: 'font-size:12px;color:var(--muted);padding:18px 0;text-align:center' }, '数据不足 2 天，先坚持刷题吧')
  const W = 460, H = 120, P = 24, max = Math.max(...days.map(d => d.answered), 5)
  const x = i => P + i * (W - 2 * P) / (days.length - 1), yA = v => H - P - (v / max) * (H - 2 * P), yR = v => H - P - (v / 100) * (H - 2 * P)
  const svg = svgmk('svg', { viewBox: `0 0 ${W} ${H}` })
  svg.appendChild(svgmk('line', { x1: P, y1: H - P, x2: W - P, y2: H - P, class: 'chart-grid' }))
  svg.appendChild(svgmk('polyline', { points: days.map((d, i) => `${x(i)},${yA(d.answered)}`).join(' '), class: 'chart-line', stroke: '#6366f1' }))
  svg.appendChild(svgmk('polyline', { points: days.map((d, i) => `${x(i)},${yR(d.rate)}`).join(' '), class: 'chart-line', stroke: '#10b981', 'stroke-dasharray': '4 3' }))
  days.forEach((d, i) => { svg.appendChild(svgmk('circle', { cx: x(i), cy: yA(d.answered), r: 2.6, fill: '#6366f1' })); svg.appendChild(svgmk('circle', { cx: x(i), cy: yR(d.rate), r: 2.6, fill: '#10b981' })) })
  const lx = svgmk('text', { x: P, y: 12, class: 'chart-label' }); lx.textContent = '● 答题数(左) 　● 正确率%(右)　' + days[0].date.slice(5) + ' → ' + days[days.length - 1].date.slice(5)
  svg.appendChild(lx)
  return el('div', { class: 'chartcard' }, svg)
}
function svgRadar(mastery) {
  const mods = Object.keys(mastery || {})
  if (mods.length < 3) return el('div', { style: 'font-size:12px;color:var(--muted);padding:18px 0;text-align:center' }, '至少 3 个模块有作答后展示能力雷达')
  const C = 110, R = 78, N = mods.length
  const svg = svgmk('svg', { viewBox: '0 0 220 220' })
  const pt = (i, r) => { const a = Math.PI * 2 * i / N - Math.PI / 2; return [C + r * Math.cos(a), C + r * Math.sin(a)] }
  for (const ring of [0.33, 0.66, 1]) svg.appendChild(svgmk('polygon', { points: mods.map((_, i) => pt(i, R * ring).join(',')).join(' '), fill: 'none', class: 'chart-grid' }))
  svg.appendChild(svgmk('polygon', { points: mods.map((m, i) => pt(i, R * (mastery[m].mastery / 100)).join(',')).join(' '), fill: 'rgba(99,102,241,.22)', stroke: '#6366f1', 'stroke-width': 2 }))
  mods.forEach((m, i) => { const [tx, ty] = pt(i, R + 20); const t = svgmk('text', { x: tx, y: ty, 'text-anchor': 'middle', class: 'chart-label' }); t.textContent = m.slice(0, 4) + '·' + mastery[m].mastery; t.style.fontSize = '9px'; svg.appendChild(t) })
  return el('div', { class: 'chartcard' }, svg)
}
function svgHeat(days) {
  const map = {}; (days || []).forEach(d => map[d.date] = d)
  const cells = []; const now = new Date()
  for (let i = 29; i >= 0; i--) {
    const dt = new Date(now.getTime() - i * 86400000)
    const k = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0, 10)
    cells.push(map[k] || { date: k, answered: 0, rate: 0 })
  }
  const color = c => !c.answered ? 'var(--border)' : c.rate >= 80 ? '#10b981' : c.rate >= 50 ? '#6366f1' : '#f59e0b'
  const grid = el('div', { style: 'display:grid;grid-template-columns:repeat(10,1fr);gap:5px' })
  cells.forEach(c => grid.appendChild(el('div', { title: `${c.date} ${c.answered}题 ${c.answered ? c.rate + '%' : ''}`, style: `aspect-ratio:1;border-radius:6px;background:${color(c)};transition:transform .15s`, onmouseenter: e => e.target.style.transform = 'scale(1.18)', onmouseleave: e => e.target.style.transform = '' })))
  return el('div', {}, grid, el('div', { style: 'font-size:10.5px;color:var(--muted);margin-top:8px' }, '近 30 天学习热力（绿≥80% · 紫≥50% · 橙<50% · 灰=未学）'))
}

/* ═══════════════════════════════════════════════════════════════
   导航与路由
   ═══════════════════════════════════════════════════════════════ */
const VIEWS = [['dashboard', '📊 仪表盘'], ['practice', '✏️ 刷题'], ['wrongbook', '📕 错题本'], ['plan', '📅 计划'], ['search', '🔍 检索'], ['method', '📖 方法论'], ['graph', '🕸️ 图谱'], ['obs', '📡 可观测']]
let cur = localStorage.getItem('kg-view') || 'dashboard'; if (!VIEWS.some(v => v[0] === cur)) cur = 'dashboard'
const tabsEl = document.getElementById('tabs')
VIEWS.forEach(([id, label]) => { const b = el('button', { class: 'tab' + (id === cur ? ' on' : ''), onclick: () => go(id) }, label); b.dataset.v = id; tabsEl.appendChild(b) })
function go(id) { cur = id; localStorage.setItem('kg-view', id); tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === id)); render() }
let TEARDOWN = null, obsTimer = null
function teardown() { if (TEARDOWN) { try { TEARDOWN() } catch {} TEARDOWN = null } }

const app = document.getElementById('app')
async function render() {
  clearTimeout(obsTimer); teardown()
  if (!BASE) { const st = await discover(); paintBeacon(st) }
  app.innerHTML = ''
  if (!BASE) { app.appendChild(el('div', { class: 'empty' }, el('div', { class: 'spin' }), '正在连接本地服务…', el('div', { style: 'font-size:11px;margin-top:8px;opacity:.7' }, '请确认 DSH 已加载 dsh-kaogong 插件'))); return }
  const wrap = el('div', { class: 'view-anim' }); app.appendChild(wrap)
  try {
    if (cur === 'dashboard') await vDashboard(wrap);
    else if (cur === 'practice') await vPractice(wrap);
    else if (cur === 'wrongbook') await vWrongbook(wrap);
    else if (cur === 'plan') await vPlan(wrap);
    else if (cur === 'search') vSearch(wrap);
    else if (cur === 'method') await vMethod(wrap);
    else if (cur === 'graph') await vGraph(wrap);
    else if (cur === 'obs') { await vObs(wrap); obsTimer = setTimeout(() => { if (cur === 'obs') render() }, 5000) }
  } catch (e) {
    wrap.innerHTML = ''; wrap.appendChild(el('div', { class: 'empty' }, el('div', { class: 'i' }, '⚠️'), '加载失败: ' + e.message, el('button', { class: 'btn o', style: 'margin-top:12px', onclick: render }, '重试')))
  }
}
function paintBeacon(st) {
  document.getElementById('beacon').className = 'beacon' + (st ? '' : ' down')
  document.getElementById('beacon-txt').textContent = st ? (BASE === '/kaogong' ? '🏠 宿主同源' : `:${st.port} 就绪`) : '离线'
  document.getElementById('ws-tag').textContent = '📁 ' + String(WS).split(/[\\\\/]/).pop()
  document.getElementById('ws-tag').title = WS
}

/* ═══════════════════════════════════════════════════════════════
   仪表盘
   ═══════════════════════════════════════════════════════════════ */
async function vDashboard(wrap) {
  wrap.appendChild(skel(2))
  const [st, stats] = await Promise.all([api('/api/status'), api('/api/stats')])
  wrap.innerHTML = ''
  const rate = stats.rate, rc = rate >= 80 ? 'c-ok' : rate >= 60 ? 'c-blue' : rate >= 40 ? 'c-warn' : 'c-bad'
  wrap.appendChild(el('div', { class: 'grid g4' },
    el('div', { class: 'card stat c-blue' }, el('div', { class: 'v' }, `${st.repos.ready}/${st.repos.total}`), el('div', { class: 'l' }, '资源仓库')),
    el('div', { class: 'card stat c-ok' }, el('div', { class: 'v' }, stats.answered), el('div', { class: 'l' }, '累计答题')),
    el('div', { class: 'card stat ' + rc }, el('div', { class: 'v' }, rate + '%'), el('div', { class: 'l' }, '总体正确率')),
    el('div', { class: 'card stat c-warn' }, el('div', { class: 'v' }, 'D' + (stats.day || 1)), el('div', { class: 'l' }, '计划进度日'))))
  const cards = el('div', { class: 'grid g2' })
  cards.appendChild(el('div', { class: 'card' }, el('div', { class: 'ct' }, '📈 近 14 日趋势', stats.streak > 1 ? el('span', { class: 'streak-badge', style: 'margin-left:auto' }, '🔥 连续 ' + stats.streak + ' 天') : null), svgLine(stats.days)))
  cards.appendChild(el('div', { class: 'card' }, el('div', { class: 'ct' }, '🎯 模块能力雷达（正确率×置信）'), svgRadar(stats.mastery)))
  wrap.appendChild(cards)
  wrap.appendChild(el('div', { class: 'card' }, el('div', { class: 'ct' }, '🗓️ 学习热力', el('span', { style: 'margin-left:auto;font-size:11.5px;color:var(--muted)' }, `📕 待消灭 ${stats.wrong.open} · 已掌握 ${stats.wrong.mastered}`)), svgHeat(stats.days)))
  wrap.appendChild(el('div', { class: 'card' }, el('div', { class: 'ct' }, '🚀 快速开始'),
    el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
      el('button', { class: 'btn p', onclick: () => { PS.srs = true; PS.module = '综合'; PS.all = []; PS.qi = 0; PS.q = null; go('practice') } }, '🧠 智能刷题(SRS)'),
      el('button', { class: 'btn o', onclick: () => go('wrongbook') }, '📕 错题回炉' + (stats.wrong.open ? ` (${stats.wrong.open})` : '')),
      el('button', { class: 'btn o', onclick: () => go('plan') }, '📅 查看计划'),
      el('button', { class: 'btn o', onclick: () => go('search') }, '🔍 知识检索'))))
}

/* ═══════════════════════════════════════════════════════════════
   刷题（SRS + 计时 + 键盘流 + 连击）
   ═══════════════════════════════════════════════════════════════ */
const PS = { module: null, all: [], qi: 0, q: null, sel: null, answered: false, srs: true, streak: 0, t0: 0 }
async function vPractice(wrap) {
  if (!PS.module) {
    const { modules } = await api('/api/modules')
    const c = el('div', { class: 'card' }, el('div', { class: 'ct' }, '选择练习模式'), el('div', { class: 'grid g4' }))
    c.lastChild.appendChild(el('div', { class: 'modcard', style: 'border-color:var(--primary);background:var(--chip)', onclick: () => { PS.srs = true; PS.module = '综合'; PS.all = []; PS.qi = 0; PS.q = null; loadQ().then(render) } },
      el('div', { class: 'n' }, '🧠 智能 SRS'), el('div', { class: 'm' }, '错题回炉优先 + 弱点加权')))
    c.lastChild.appendChild(el('div', { class: 'modcard', style: 'border-style:dashed', onclick: () => { PS.srs = false; PS.module = '综合'; PS.all = []; PS.qi = 0; PS.q = null; loadQ().then(render) } },
      el('div', { class: 'n' }, '🎲 纯随机'), el('div', { class: 'm' }, '六模块均匀抽')))
    Object.entries(modules).forEach(([name, info]) => c.lastChild.appendChild(el('div', { class: 'modcard', onclick: () => { PS.srs = true; PS.module = name; PS.all = []; PS.qi = 0; PS.q = null; loadQ().then(render) } },
      el('div', { class: 'n' }, name), el('div', { class: 'm' }, `${info.fileCount} 套真题`))))
    c.appendChild(el('div', { style: 'font-size:11px;color:var(--muted);margin-top:10px' }, '快捷键：<span class="kbd">A</span>~<span class="kbd">D</span> 选择 · <span class="kbd">Enter</span> 提交 · <span class="kbd">N</span> 下一题'))
    wrap.appendChild(c); return
  }
  if (!PS.q) await loadQ()
  const q = PS.q
  if (!q) { wrap.appendChild(el('div', { class: 'empty' }, el('div', { class: 'i' }, '📭'), '暂无可解析题目', el('button', { class: 'btn o', style: 'margin-top:12px', onclick: () => { PS.module = null; render() } }, '返回'))); return }
  PS.t0 = Date.now()
  const head = el('div', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap' },
    el('button', { class: 'btn o', onclick: () => { PS.module = null; PS.q = null; render() } }, '← 模式'),
    el('span', { class: 'tag' }, q.module), el('span', { class: 'tag' }, q.type),
    q.fromWrongBook ? el('span', { class: 'srsonly' }, '📕 回炉 · 箱' + q.box + ' · 错' + q.wrongCount + '次') : null,
    q.year ? el('span', { class: 'tag' }, q.year + '年') : null,
    el('span', { class: 'timer-pill', id: 'ptimer' }, '00:00'),
    PS.streak >= 3 ? el('span', { class: 'streak-badge' }, '🔥×' + PS.streak) : null,
    el('span', { style: 'margin-left:auto;font-size:11px;color:var(--muted)' }, `${PS.qi}/${PS.all.length}`))
  const c = el('div', { class: 'card' }, head, el('div', { class: 'qstem' }, q.stem))
  Object.entries(q.options || {}).forEach(([L, text]) => {
    let cls = 'opt'
    if (PS.answered) { if (L === q.correctAnswer) cls += ' hit'; else if (L === PS.sel) cls += ' err' }
    else if (L === PS.sel) cls += ' sel'
    c.appendChild(el('div', { class: cls, onclick: () => { if (!PS.answered) { PS.sel = L; render() } } }, el('div', { class: 'lb' }, L), el('div', { style: 'flex:1' }, text)))
  })
  if (!PS.answered && PS.sel) c.appendChild(el('div', { style: 'margin-top:12px' }, el('button', { class: 'btn p', onclick: submit }, '提交答案 (Enter)')))
  if (PS.answered) {
    const ok = PS.sel === q.correctAnswer
    c.appendChild(el('div', { class: 'analysis' }, el('div', { style: `font-weight:800;margin-bottom:8px;color:${ok ? 'var(--ok)' : 'var(--bad)'}` }, ok ? '✅ 回答正确' : `❌ 错误 · 正确答案 ${q.correctAnswer}`), q.analysis || '（该题无官方解析）'))
    c.appendChild(el('div', { style: 'margin-top:12px;display:flex;gap:8px' },
      el('button', { class: 'btn p', onclick: next }, '下一题 (N)'),
      el('button', { class: 'btn o', onclick: () => { PS.sel = null; PS.answered = false; render() } }, '重答'),
      el('button', { class: 'btn o', onclick: () => { PS.module = null; PS.q = null; render() } }, '换模式')))
  }
  wrap.appendChild(c)
  const timer = setInterval(() => {
    const t = document.getElementById('ptimer'); if (!t) { clearInterval(timer); return }
    const s = Math.floor((Date.now() - PS.t0) / 1000); t.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')
    t.className = 'timer-pill' + (s > 120 ? ' hot' : '')
  }, 500)
  const keys = e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return
    const k = e.key.toUpperCase()
    if (!PS.answered && 'ABCD'.includes(k) && q.options && k in q.options) { PS.sel = k; render() }
    else if (e.key === 'Enter' && PS.sel && !PS.answered) submit()

  view: { x: 0, y: 0, k: 1 }, layout: 'force',
  types: new Set(), edgeTypes: new Set(),

const gNodeMeta = t => G.nodeMeta[t] || { label: String(t), color: '#888888', icon: '•', layer: 6 }
const gEdgeMeta = r => G.edgeMeta[r] || { label: String(r), color: '#94a3b8' }
function gRadius(type) {
  if (type === 'plugin') return 22
  if (type === 'domain' || type === 'view') return 13
  if (type === 'entry' || type === 'channel' || type === 'lifecycle') return 11
  if (type === 'day') return 5
  return 8
}

/* ── 本地降级算法（服务端 analytics 缺失时使用；全部确定性）── */
function gLocalDegree(nodes, edges) {
  const d = {}; nodes.forEach(n => d[n.id] = { in: 0, out: 0, total: 0 })
  edges.forEach(e => { if (d[e.source]) d[e.source].out++; if (d[e.target]) d[e.target].in++ })
  nodes.forEach(n => { const x = d[n.id]; x.total = x.in + x.out })
  return d
}
function gLocalComponents(nodes, adj) {
  const comp = {}; let cid = 0
  nodes.forEach(n => {
    if (comp[n.id] != null) return
    comp[n.id] = cid; const q = [n.id]
    while (q.length) {
      const c = q.pop()
      for (const nb of adj[c] || []) if (comp[nb] == null) { comp[nb] = cid; q.push(nb) }
    }
    cid++
  })
  return { comp, count: cid }
}
function gLocalCommunities(nodes, adj) {
  const ids = nodes.map(n => n.id).sort()
  const label = {}; ids.forEach(id => label[id] = id)
  for (let it = 0; it < 20; it++) {
    let changed = false
    ids.forEach(id => {
      const cnt = {}
      for (const nb of adj[id] || []) cnt[label[nb]] = (cnt[label[nb]] || 0) + 1
      let best = label[id], bestC = cnt[label[id]] || 0
      Object.keys(cnt).sort().forEach(l => { if (cnt[l] > bestC) { best = l; bestC = cnt[l] } })
      if (best !== label[id]) { label[id] = best; changed = true }
    })
    if (!changed) break
  }
  const groups = {}; const comm = {}
  ids.forEach(id => { if (groups[label[id]] == null) groups[label[id]] = Object.keys(groups).length; comm[id] = groups[label[id]] })
  return comm
}
function gLocalClustering(adj) {
  const c = {}; let sum = 0, cnt = 0
  Object.keys(adj).forEach(id => {
    const nb = [...adj[id]], k = nb.length
    if (k < 2) { c[id] = 0; return }
    let links = 0
    for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++) if (adj[nb[i]].has(nb[j])) links++
    const v = 2 * links / (k * (k - 1)); c[id] = v; sum += v; cnt++
  })
  return { c, avg: cnt ? sum / cnt : 0 }
}
/** 分层布局降级：以节点类型的语义层（NODE_META.layer）为纵向层，层内按 id 排序均布 */
function gLocalLayered(nodes, w, h) {
  const rows = {}
  nodes.forEach(n => { const L = gNodeMeta(n.type).layer; (rows[L] = rows[L] || []).push(n) })
  const keys = Object.keys(rows).map(Number).sort((a, b) => a - b)
  const padX = 70, padY = 50
  keys.forEach((L, li) => {
    const arr = rows[L].slice().sort((a, b) => (String(a.id) < String(b.id) ? -1 : 1))
    const y = keys.length > 1 ? padY + li * (h - 2 * padY) / (keys.length - 1) : h / 2
    arr.forEach((n, i) => {
      n.x = arr.length > 1 ? padX + i * (w - 2 * padX) / (arr.length - 1) : w / 2
      n.y = y
    })
  })
}

/** 数据准备：索引边、计算度/社区/集聚/邻接，合并服务端分析结果 */
function gPrepare(raw) {
  G.nodeMeta = { ...NODE_META_FALLBACK, ...(raw.nodeMeta || {}) }
  G.edgeMeta = { ...EDGE_META_FALLBACK, ...(raw.edgeMeta || {}) }
  const nodes = (raw.nodes || []).map(n => ({
    ...n, rad: gRadius(n.type), vx: 0, vy: 0, fx: null, fy: null,
    nb: [], inE: [], outE: [],
  }))
  const idx = {}; nodes.forEach(n => idx[n.id] = n)
  const edges = (raw.edges || []).map(e => ({ ...e, s: idx[e.source], t: idx[e.target] })).filter(e => e.s && e.t)
  edges.forEach(e => {
    if (e.s.nb.indexOf(e.t.id) < 0) e.s.nb.push(e.t.id)
    if (e.t.nb.indexOf(e.s.id) < 0) e.t.nb.push(e.s.id)
    e.s.outE.push(e); e.t.inE.push(e)
  })
  const adj = {}; nodes.forEach(n => adj[n.id] = new Set())
  edges.forEach(e => { adj[e.source].add(e.target); adj[e.target].add(e.source) })
  // 本地计算（始终做，服务端字段优先覆盖）
  const degree = gLocalDegree(nodes, edges)
  nodes.forEach(n => { const d = degree[n.id]; n.inDeg = d.in; n.outDeg = d.out; n.deg = d.total })
  const comps = gLocalComponents(nodes, adj)
  nodes.forEach(n => n.comp = comps.comp[n.id])
  const comm = gLocalCommunities(nodes, adj)
  nodes.forEach(n => n.comm = comm[n.id])
  const clus = gLocalClustering(adj)
  nodes.forEach(n => n.cluster = clus.c[n.id] || 0)
  const an = raw.analytics || {}
  // 服务端分析覆盖
  if (an.degree) nodes.forEach(n => { const d = an.degree[n.id]; if (d) { n.inDeg = d.in; n.outDeg = d.out; n.deg = d.total } })
  let commCount = 0, commSizes = []
  if (Array.isArray(an.communities) && an.communities.length) {
    commCount = an.communities.length
    commSizes = an.communities.slice(0, 8).map(c => ({ id: c.id, size: c.size }))
    const map = {}
    an.communities.forEach((c, ci) => (c.members || []).forEach(id => map[id] = ci))
    nodes.forEach(n => { if (map[n.id] != null) n.comm = map[n.id] })
  } else {
    const uniq = {}; nodes.forEach(n => uniq[n.comm] = (uniq[n.comm] || 0) + 1)
    commSizes = Object.keys(uniq).sort((a, b) => uniq[b] - uniq[a]).slice(0, 8).map(k => ({ id: 'C' + k, size: uniq[k] }))
    commCount = Object.keys(uniq).length
  }

/* ── 布局：分层（服务端 layout 优先）── */

function gTick() {

      const B = nodes[j]

function gLocalPath(from, to) {

/** 适配画布：按当前可见节点包围盒设置视图（含 padding） */
function gFit() {
  if (!G.data) return
  const ns = G.data.nodes.filter(gVisible)
  if (!ns.length) return
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
  ns.forEach(n => { minX = Math.min(minX, n.x); minY = Math.min(minY, n.y); maxX = Math.max(maxX, n.x); maxY = Math.max(maxY, n.y) })
  const pad = 46
  const w = Math.max(60, maxX - minX), h = Math.max(60, maxY - minY)
  const k = Math.max(0.25, Math.min(4, Math.min((GEL.w - 2 * pad) / w, (GEL.h - 2 * pad) / h)))
  G.view.k = k
  G.view.x = GEL.w / 2 - (minX + maxX) / 2 * k
  G.view.y = GEL.h / 2 - (minY + maxY) / 2 * k
  gKick(2)
}

  const rows = Object.entries(tel.endpoints || {}).map(([p, d]) => ({
    path: p, count: d.count || 0, errors: d.errors || 0, errRate: d.errRate || 0,
    p50: d.p50 || 0, p95: d.p95 || 0, lastActive: d.lastActive, series: d.series || [],
  }))
  if (!rows.length) { card.appendChild(notice('尚无遥测样本：先浏览几个视图再回来', 'info')); return card }
  const cols = [['path', '端点'], ['count', '次数'], ['errors', '错误'], ['errRate', '错误率'], ['p50', 'p50'], ['p95', 'p95'], ['lastActive', '最近'], ['series', '趋势']]
  const table = el('table', { class: 'tel perf' })
  const thead = el('thead'), tbody = el('tbody')
  table.append(thead, tbody)
  const fmtLast = v => v == null ? '—' : v < 60 ? v + 's' : v < 3600 ? Math.round(v / 60) + 'm' : Math.round(v / 3600) + 'h'
  const paintHead = () => {
    const tr = el('tr')
    cols.forEach(([k, label]) => {
      const active = OBS.key === k
      const th = el('th', { class: 'sortable' + (active ? ' on' : '') + (k === 'series' ? ' noselect' : ''), title: k === 'series' ? '延迟趋势' : '点击按此列排序' },
        label, active ? el('span', { class: 'arrow' }, OBS.dir < 0 ? '▼' : '▲') : null)
      if (k !== 'series') th.addEventListener('click', () => {
        if (OBS.key === k) OBS.dir = -OBS.dir
        else { OBS.key = k; OBS.dir = k === 'path' ? 1 : -1 }
        paintHead(); paintBody()
      })
      tr.appendChild(th)
    })
    thead.replaceChildren(tr)
  }
  const cmp = (a, b) => {
    const k = OBS.key
    if (k === 'path') return OBS.dir * String(a.path).localeCompare(String(b.path))
    let x = a[k], y = b[k]
    if (k === 'lastActive') { x = x == null ? 1e9 : x; y = y == null ? 1e9 : y }
    return OBS.dir * ((x || 0) - (y || 0))
  }
  const paintBody = () => {
    tbody.replaceChildren(...[...rows].sort(cmp).map(r => el('tr', {},
      el('td', { class: 'mono' }, r.path),
      el('td', null, String(r.count)),
      el('td', { style: 'color:' + (r.errors ? 'var(--bad)' : 'var(--muted)') }, String(r.errors)),
      el('td', { style: 'color:' + (r.errRate > 0.01 ? 'var(--bad)' : r.errRate > 0 ? 'var(--warn)' : 'var(--muted)') }, (r.errRate * 100).toFixed(1) + '%'),
      el('td', null, r.p50 + 'ms'),
      el('td', { style: 'color:' + (r.p95 > 500 ? 'var(--bad)' : r.p95 > 200 ? 'var(--warn)' : 'inherit') }, r.p95 + 'ms'),
      el('td', { class: 'muted' }, fmtLast(r.lastActive)),
      el('td', null, spark(r.series)))))
  }
  paintHead(); paintBody()
  card.appendChild(el('div', { class: 'tablewrap' }, table))
  if (Array.isArray(tel.topSlow) && tel.topSlow.length) {
    card.appendChild(el('div', { class: 'chips', style: 'margin-top:10px' },
      el('span', { class: 'muted sm' }, '🐢 最慢端点（p95）：'),
      tel.topSlow.slice(0, 6).map(s => el('span', { class: 'pill warn' }, s.path + ' · ' + s.p95 + 'ms'))))
  }
  return card
}
function obsAlertsCard(tel) {
  const list = obsAlerts(tel)
  const card = el('div', { class: 'card' }, el('div', { class: 'ct' }, '🚨 告警',
    el('span', { class: 'src-tag' }, list.length ? list.length + ' 条' : '无告警')))
  if (!tel) { card.appendChild(notice('遥测接口不可用，告警不可评估')); return card }
  if (!list.length) { card.appendChild(el('div', { class: 'notice ok' }, '✅ 全部端点 p95 < 200ms 且错误率 < 1%')); return card }
  const box = el('div', { class: 'alerts' })
  list.forEach(a => box.appendChild(el('div', { class: 'alert ' + (a.level || 'info') },
    el('span', { class: 'alert-lv' }, a.level === 'error' ? 'ERROR' : a.level === 'warn' ? 'WARN' : 'INFO'),
    el('span', null, String(a.msg || '')))))
  card.appendChild(box)
  return card
}
function obsHistCard(hist) {
  const card = el('div', { class: 'card' }, el('div', { class: 'ct' }, '📈 全局延迟直方图（有序统计）'))
  if (!hist) { card.appendChild(notice('暂无延迟样本', 'info')); return card }
  const max = Math.max(hist.p99 || 0, hist.max || 0, 1)
  ;[['p50', hist.p50], ['p90', hist.p90], ['p95', hist.p95], ['p99', hist.p99], ['max', hist.max]].forEach(([k, v]) => {
    card.appendChild(el('div', { class: 'hbar' },
      el('span', { class: 'hb-l' }, k),
      el('div', { class: 'bar' }, el('i', { class: (v > 500 ? 'f-bad' : v > 200 ? 'f-warn' : 'f-ok'), style: `width:${Math.round((v || 0) / max * 100)}%` })),
      el('span', { class: 'hb-v' }, String(v) + 'ms')))
  })
  return card
}
function obsWsCard(wss) {
  const card = el('div', { class: 'card' }, el('div', { class: 'ct' }, '🗂️ 工作区隔离命名空间'))
  if (!wss) { card.appendChild(notice('工作区接口不可用')); return card }
  card.appendChild(el('div', { class: 'muted sm', style: 'margin-bottom:8px' }, '当前：' + WS))
  const list = wss.workspaces || []
  if (!list.length) { card.appendChild(el('div', { class: 'muted sm' }, '暂无命名空间数据')); return card }
  list.forEach(w => card.appendChild(el('div', { class: 'nsrow' },
    el('span', { class: 'ns-name', title: w.ns }, String(w.label || w.ns).slice(0, 26)),
    el('span', { class: 'muted' }, 'D' + w.day),
    el('span', null, w.answered + '题'),
    el('div', { class: 'bar' }, el('i', { class: w.rate >= 80 ? 'f-ok' : w.rate >= 60 ? 'f-blue' : 'f-warn', style: `width:${w.rate}%` })),
    el('span', { class: 'ns-rate' }, w.rate + '%'))))
  return card
}
function obsCapsCard(caps, tel) {
  const card = el('div', { class: 'card' }, el('div', { class: 'ct' }, '🗺️ 能力矩阵（端点 × 消费者）'))
  if (!caps) { card.appendChild(notice('能力矩阵接口不可用')); return card }
  const consumed = new Set(Object.keys((tel && tel.endpoints) || {}))
  const list = caps.endpoints || []
  if (!list.length) { card.appendChild(el('div', { class: 'muted sm' }, '能力清单为空')); return card }
  const box = el('div', { class: 'caps' })
  list.forEach(e => {
    const on = consumed.has(e.path)
    box.appendChild(el('div', { class: 'caprow' },
      el('span', { class: 'cap-path', title: e.path }, e.path),
      el('span', { class: 'cap-lb' }, String(e.label || '')),
      el('span', { class: 'muted sm' }, (e.consumers || []).length + ' 消费者'),
      el('span', { class: 'tag' + (on ? ' ok' : '') }, on ? '活跃' : '未触达')))
  })
  card.appendChild(box)
  return card
}
function obsActionsCard(getData) {
  const card = el('div', { class: 'card' }, el('div', { class: 'ct' }, '🛠️ 管理动作'))
  const btnRefresh = el('button', { class: 'btn p', onclick: () => { toast('正在刷新…', 'info', 1200); render() } }, '🔄 刷新')
  const btnExport = el('button', { class: 'btn o', onclick: () => {
    const d = getData()
    const blob = new Blob([JSON.stringify({ generatedAt: new Date().toISOString(), ws: WS, ...d }, null, 2)], { type: 'application/json' })
    const url = URL.createObjectURL(blob)
    const a = el('a', { href: url, download: 'kaogong-diagnose-' + Date.now() + '.json' })
    document.body.appendChild(a); a.click(); a.remove()
    setTimeout(() => URL.revokeObjectURL(url), 3000)
    toast('诊断快照已导出', 'ok', 1800)
  } }, '📥 导出诊断 JSON')
  const btnCopy = el('button', { class: 'btn o', onclick: () => {
    const d = getData()
    const tel = d.telemetry || {}, caps = d.capabilities || {}
    const txt = [`dsh-kaogong v${(caps.plugin && caps.plugin.version) || '?'} · ws=${WS}`,
      `uptime=${fmtDur(tel.uptimeSec)} requests=${tel.totalRequests} qps=${tel.qpsWindow}`,
      `endpoints=${tel.activeEndpoints}/${tel.declaredEndpoints} coverage=${Math.round((tel.coverage || 0) * 100)}%`,
      `alerts=${(tel.alerts || []).length}`].join('\n')
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('能力摘要已复制', 'ok', 1600)).catch(() => toast('复制失败（浏览器未授权）', 'bad', 2000))
    else toast('当前环境不支持剪贴板', 'warn', 2000)
  } }, '📋 复制能力摘要')
  card.appendChild(el('div', { class: 'obs-actions' }, btnRefresh, btnExport, btnCopy))
  card.appendChild(el('div', { class: 'muted sm', style: 'margin-top:8px' }, '导出内容含遥测/能力矩阵/生命周期/命名空间快照，便于离线排障。'))
  return card
}
async function vObs(wrap) {
  const [telR, capsR, wsR, stR, lifeR] = await Promise.all([
    apiSafe('/api/telemetry'), apiSafe('/api/capabilities'), apiSafe('/api/workspaces'),
    apiSafe('/api/status'), apiSafe('/api/lifecycle'),
  ])
  const tel = telR.ok ? telR.data : null
  const caps = capsR.ok ? capsR.data : null
  const wss = wsR.ok ? wsR.data : null
  const st = stR.ok ? stR.data : null
  const life = lifeR.ok ? lifeR.data : null
  const failed = [['遥测', telR], ['能力矩阵', capsR], ['工作区', wsR], ['状态', stR], ['生命周期', lifeR]]
    .filter(([, r]) => !r.ok).map(([n, r]) => n + '（' + r.err + '）')
  if (failed.length) {
    wrap.appendChild(el('div', { class: 'card failcard' },
      el('div', { class: 'ct' }, '⚠️ 部分接口不可用（已分区降级，页面仍可用）'),
      el('div', { class: 'muted sm' }, failed.join(' · '))))
  }
  const hist = obsHistogram(tel)
  const alerts = obsAlerts(tel)
  // A. 概览 KPI
  wrap.appendChild(el('div', { class: 'grid g4' },
    kv0('运行时长', tel ? fmtDur(tel.uptimeSec) : st ? fmtDur(st.uptimeSec) : '—'),
    kv0('总请求', tel ? tel.totalRequests : '—'),
    kv0('QPS(60s)', tel ? tel.qpsWindow : '—'),
    kv0('端点覆盖', tel ? Math.round((tel.coverage || 0) * 100) + '%' : '—'),
    kv0('活跃/声明', tel ? tel.activeEndpoints + '/' + tel.declaredEndpoints : '—'),
    kv0('p95 延迟', hist ? hist.p95 + 'ms' : '—'),
    kv0('告警数', alerts.length),
    kv0('服务 PID', st ? st.pid : '—')))
  // B. 告警 + 直方图
  const row1 = el('div', { class: 'grid g2' })
  row1.append(obsAlertsCard(tel), obsHistCard(hist))
  wrap.appendChild(row1)
  // C. 生命周期
  wrap.appendChild(obsLifeCard(life, caps, tel))
  // D. 能力对账
  wrap.appendChild(obsReconCard(caps, tel))
  // E. 端点性能（排序表）
  wrap.appendChild(obsPerfCard(tel))
  // F/G. 能力矩阵 + 命名空间
  const row2 = el('div', { class: 'grid g2' })
  row2.append(obsCapsCard(caps, tel), obsWsCard(wss))
  wrap.appendChild(row2)
  // H. 管理动作
  wrap.appendChild(obsActionsCard(() => ({ telemetry: tel, capabilities: caps, lifecycle: life, workspaces: wss, status: st })))
  wrap.appendChild(el('div', { class: 'muted sm', style: 'text-align:right' }, '每 5 秒自动刷新 · 所有请求带 ?ws= 隔离键'))
}
function spark(series) {
  const w = 90, h = 18, dpr = devicePixelRatio || 1, c = document.createElement('canvas')
  c.width = w * dpr; c.height = h * dpr
  c.style.cssText = `width:${w}px;height:${h}px;vertical-align:middle`
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0)
  if (!series || series.length < 2) return c
  const max = Math.max(...series, 1)
  x.strokeStyle = '#6366f1'; x.lineWidth = 1; x.beginPath()
  series.forEach((v, i) => { const px = i / (series.length - 1) * w, py = h - (v / max) * (h - 2) - 1; i ? x.lineTo(px, py) : x.moveTo(px, py) })
  x.stroke(); return c
}
